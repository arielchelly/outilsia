<!DOCTYPE html>
<html>
<head><style>
body { background: #16161A; padding: 60px; font-family: system-ui; color: white; }
.row { display: flex; gap: 80px; align-items: center; margin-bottom: 40px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 16px; }
img { width: 96px; height: 96px; image-rendering: -webkit-optimize-contrast; background: #2a2a2a; padding: 12px; border-radius: 8px; }
.label { font-size: 13px; color: #86868B; letter-spacing: 0.1em; text-transform: uppercase; }
</style></head>
<body>
  <div class="row">
    <div class="cell"><img src="/cursors/cursor-default.svg" /><div class="label">Default (arrow)</div></div>
    <div class="cell"><img src="/cursors/cursor-hand-open.svg" /><div class="label">Hand open</div></div>
    <div class="cell"><img src="/cursors/cursor-hand-point.svg" /><div class="label">Hand point</div></div>
  </div>
</body>
</html>
