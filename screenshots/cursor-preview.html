<!DOCTYPE html>
<html>
<head><style>
body { background: #16161A; padding: 60px; font-family: system-ui; color: white; }
.row { display: flex; gap: 80px; align-items: center; margin-bottom: 40px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 16px; }
img { width: 80px; height: 80px; image-rendering: crisp-edges; background: #2a2a2a; padding: 8px; border-radius: 8px; }
.label { font-size: 13px; color: #86868B; letter-spacing: 0.1em; text-transform: uppercase; }
</style></head>
<body>
  <div class="row">
    <div class="cell"><img src="/cursors/arrow.svg" /><div class="label">Arrow (default)</div></div>
    <div class="cell"><img src="/cursors/pointer.svg" /><div class="label">Pointer (links)</div></div>
    <div class="cell"><img src="/cursors/grab.svg" /><div class="label">Grab</div></div>
  </div>
</body>
</html>
